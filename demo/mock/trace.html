<!doctype html><meta charset="utf-8">
<title>Talos — every crossing on the record</title>
<style>
 :root{--bg:#0F1720;--panel:#141D28;--line:#22303F;--ink:#F4F1EA;--dim:#8595A5;--acc:#F2994A;--teal:#3FB6C9;--red:#E4572E;--grn:#6FCF7E}
 *{box-sizing:border-box;margin:0}
 body{background:var(--bg);color:var(--ink);font:15px/1.5 'JetBrains Mono',ui-monospace,Menlo,monospace;width:1280px;height:720px;overflow:hidden;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
 header{display:flex;align-items:baseline;gap:16px}
 h1{font-size:22px;font-weight:600}
 .sub{font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:2px}
 .clock{margin-left:auto;font-size:24px;color:var(--dim);font-variant-numeric:tabular-nums}
 .stage{position:relative;height:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
 .lbl{position:absolute;left:14px;font-size:13px;color:var(--dim);transform:translateY(-50%)}
 .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:250px;padding:12px 16px;background:#0B1119;border:1px solid var(--acc);border-radius:10px;text-align:center}
 .hub b{color:var(--acc);font-size:13px;letter-spacing:1.5px}
 .hub p{font-size:12px;color:var(--dim);margin-top:4px}
 .pk{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal);opacity:0;transition:opacity .2s}
 .pk.on{opacity:1}
 .pk.hold{background:var(--dim);box-shadow:0 0 10px var(--dim)}
 .pk.deny{background:var(--red);box-shadow:0 0 16px var(--red)}
 table{width:100%;border-collapse:collapse;font-size:13px}
 th{text-align:left;color:var(--dim);font-weight:400;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:1px}
 td{padding:6px 10px;border-bottom:1px solid #1A2531}
 tr.row{opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s}
 tr.row.on{opacity:1;transform:none}
 .ok{color:var(--grn)} .hold{color:var(--dim)} .deny{color:var(--red)} .acc{color:var(--acc)}
 .wrap{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .cap{padding:8px 14px;font-size:12px;color:var(--dim);letter-spacing:1.5px;border-bottom:1px solid var(--line)}
</style>
<header><h1>Talos</h1><span class="sub">every crossing, on the record</span><span class="clock" id="clock">0:00</span></header>
<div class="stage" id="stage">
 <div class="lane" style="top:22%"></div><div class="lbl" style="top:22%">room A · backend-agent</div>
 <div class="lane" style="top:78%"></div><div class="lbl" style="top:78%">room B · frontend-agent</div>
 <div class="hub"><b>TALOS</b><p>decide → scope check → audit row</p></div>
 <div class="pk" id="p1"></div><div class="pk" id="p2"></div><div class="pk hold" id="p3"></div><div class="pk deny" id="p4"></div>
</div>
<div class="wrap"><div class="cap">data/audit.jsonl</div>
<table><thead><tr><th style="width:9%">t</th><th style="width:13%">from</th><th style="width:15%">kind</th><th style="width:13%">verdict</th><th style="width:9%">conf</th><th style="width:13%">to</th><th>scope check</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
const tb=document.getElementById('tb'),clock=document.getElementById('clock');
function row(t,from,kind,verdict,conf,to,check,cls){
 const tr=document.createElement('tr');tr.className='row';
 tr.innerHTML=`<td>${t}</td><td>${from}</td><td>${kind}</td><td class="${cls}">${verdict}</td><td>${conf}</td><td>${to}</td><td class="${cls}">${check}</td>`;
 tb.appendChild(tr);requestAnimationFrame(()=>tr.classList.add('on'));
 while(tb.children.length>7)tb.removeChild(tb.firstChild);}
function fly(id,fromTop,toTop,ms){const el=document.getElementById(id);const st=document.getElementById('stage').getBoundingClientRect();
 const x0=st.width*0.18,x1=st.width*0.5-6,x2=st.width*0.82;
 el.style.left=x0+'px';el.style.top=(st.height*fromTop/100-6)+'px';el.classList.add('on');
 el.animate([{transform:'translate(0,0)'},{transform:`translate(${x1-x0}px, ${st.height*(50-fromTop)/100}px)`}],{duration:ms/2,fill:'forwards',easing:'ease-in'});
 setTimeout(()=>{ if(toTop===null){el.classList.remove('on');return;}
  el.animate([{transform:`translate(${x1-x0}px, ${st.height*(50-fromTop)/100}px)`},{transform:`translate(${x2-x0}px, ${st.height*(toTop-fromTop)/100}px)`}],{duration:ms/2,fill:'forwards',easing:'ease-out'});
  setTimeout(()=>el.classList.remove('on'),ms/2+400);},ms/2);}
const S=[
 [400,()=>fly('p1',22,78,1600)],
 [1400,()=>row('0:05','backend','contract','share','0.94','frontend, qa','allowed','ok')],
 [3200,()=>fly('p2',22,78,1600)],
 [4200,()=>row('0:41','backend','contract','share','0.91','frontend, qa','allowed','ok')],
 [6000,()=>fly('p3',22,null,1600)],
 [7000,()=>row('1:12','backend','private_note','hold','0.88','—','not delivered','hold')],
 [8800,()=>fly('p4',22,null,1600)],
 [9800,()=>row('1:44','backend','private_note','share','0.52','frontend','DENIED by scope','deny')],
 [11600,()=>row('1:51','qa','read backend room','—','—','—','DENIED, never granted','deny')],
 [13400,()=>row('2:06','frontend','revoked','—','—','—','DENIED, next call','deny')],
 [17000,()=>location.reload()]
];
let t0=performance.now();
(function tick(){const s=(performance.now()-t0)/1000;clock.textContent=Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');requestAnimationFrame(tick);})();
S.forEach(([ms,fn])=>setTimeout(fn,ms));
</script>
