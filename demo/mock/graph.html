<!doctype html><html lang="en"><meta charset="utf-8"><title>Talos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0D;--txt:#F5F5F7;--mut:rgba(245,245,247,.56);--faint:rgba(245,245,247,.32);--hair:rgba(255,255,255,.08);--glass:rgba(255,255,255,.035);--blue:#8AB4FF;--amber:#E5B96B;--red:#FF7A70;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;color:var(--txt);font-family:Inter,-apple-system,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 background:radial-gradient(1100px 600px at 18% -10%,rgba(138,180,255,.10),transparent 60%),radial-gradient(900px 500px at 85% 110%,rgba(229,185,107,.06),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.brand{position:absolute;left:36px;top:30px;display:flex;align-items:center;gap:14px}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);padding:5px 11px;border:1px solid var(--hair);border-radius:999px;background:var(--glass)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue);animation:beat 2.4s var(--ease) infinite}
@keyframes beat{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
svg{position:absolute;inset:0;width:1280px;height:720px;overflow:visible}
.edge{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.25}
.draw{fill:none;stroke-width:1.75;stroke-linecap:round;opacity:0}
.node{position:absolute;transform:translate(-50%,-50%);padding:14px 18px;min-width:200px;border-radius:18px;background:var(--glass);border:1px solid var(--hair);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(14px);transition:box-shadow .7s var(--ease),border-color .7s var(--ease)}
.node .r{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}
.node .n{font-size:15px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.node .s{font-size:12px;color:var(--mut);margin-top:5px;min-height:16px;transition:color .4s}
.node.act{border-color:rgba(138,180,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 6px rgba(138,180,255,.06),0 0 48px rgba(138,180,255,.22)}
.node.warn{border-color:rgba(229,185,107,.45);box-shadow:0 0 0 6px rgba(229,185,107,.06),0 0 48px rgba(229,185,107,.18)}
.node.den{border-color:rgba(255,122,112,.5);box-shadow:0 0 0 6px rgba(255,122,112,.06),0 0 48px rgba(255,122,112,.22)}
.mem{min-width:150px;padding:9px 14px;border-radius:999px;text-align:center}
.mem .r{font-size:9.5px}.mem .n{font-size:12.5px;font-weight:500;margin-top:2px}
.hub{min-width:260px;text-align:center;padding:16px 22px;border-radius:22px;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.hub .n{font-size:17px}
.toast{position:absolute;left:640px;top:392px;transform:translate(-50%,6px);display:inline-flex;align-items:center;gap:12px;padding:9px 16px;border-radius:999px;background:rgba(20,20,26,.72);border:1px solid var(--hair);backdrop-filter:blur(16px);font-size:13px;color:var(--mut);opacity:0;transition:opacity .5s var(--ease),transform .5s var(--ease);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--txt);font-weight:600}
.toast i{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px currentColor;color:var(--blue)}
.toast.hold i{background:var(--faint);box-shadow:none}.toast.den i{background:var(--red);color:var(--red)}
.audit{position:absolute;left:36px;right:36px;bottom:30px;border-radius:18px;background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(14px);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.audit .h{display:flex;justify-content:space-between;padding:9px 16px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--hair)}
.audit table{width:100%;border-collapse:collapse;font-size:12.5px}
.audit td{padding:7px 16px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--mut)}
.audit td.t{width:70px;color:var(--faint)}
.audit td.v{font-weight:600;color:var(--txt);width:110px}
.audit tr{opacity:0;transform:translateY(-4px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.audit tr.on{opacity:1;transform:none}
.blue{color:var(--blue)!important}.amb{color:var(--amber)!important}.red{color:var(--red)!important}
</style>
<div class="brand"><h1>Talos</h1><span class="pill"><i></i>governed path · live</span></div>
<svg id="svg"><defs>
 <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="gB" x1="0" x2="1"><stop offset="0" stop-color="#8AB4FF" stop-opacity="0"/><stop offset=".5" stop-color="#8AB4FF"/><stop offset="1" stop-color="#8AB4FF" stop-opacity=".2"/></linearGradient>
 <linearGradient id="gR" x1="0" x2="1"><stop offset="0" stop-color="#FF7A70" stop-opacity="0"/><stop offset=".5" stop-color="#FF7A70"/><stop offset="1" stop-color="#FF7A70" stop-opacity=".2"/></linearGradient>
</defs>
 <path id="eAT" class="edge" d="M 352 222 C 430 222, 430 300, 486 300"/><path id="dAT" class="draw" d="M 352 222 C 430 222, 430 300, 486 300"/>
 <path id="eTB" class="edge" d="M 794 300 C 850 300, 850 222, 928 222"/><path id="dTB" class="draw" d="M 794 300 C 850 300, 850 222, 928 222"/>
 <path id="eAM" class="edge" d="M 250 262 L 250 312"/>
 <path id="eBM" class="edge" d="M 1030 262 L 1030 312"/>
 <path id="eQT" class="edge" d="M 640 444 L 640 348"/><path id="dQT" class="draw" d="M 640 444 L 640 348"/>
</svg>
<div class="node" id="nA" style="left:250px;top:222px"><div class="r">Room A</div><div class="n">backend-agent</div><div class="s" id="sA">idle</div></div>
<div class="node" id="nB" style="left:1030px;top:222px"><div class="r">Room B</div><div class="n">frontend-agent</div><div class="s" id="sB">writing the REST client</div></div>
<div class="node mem" id="mA" style="left:250px;top:334px"><div class="r">GBrain</div><div class="n">brain · A</div></div>
<div class="node mem" id="mB" style="left:1030px;top:334px"><div class="r">GBrain</div><div class="n">brain · B</div></div>
<div class="node hub" id="nT" style="left:640px;top:300px"><div class="r">Talos</div><div class="n">decider</div><div class="s" id="sT">decide · scope check · record</div></div>
<div class="node mem" id="nQ" style="left:640px;top:470px"><div class="r">Room C</div><div class="n">qa-agent</div></div>
<div class="toast" id="toast"><i></i><span id="tt"></span></div>
<div class="audit"><div class="h"><span>audit.jsonl</span><span class="mono" id="cnt">0 rows</span></div><table><tbody id="tb"></tbody></table></div>
<script>
const $=id=>document.getElementById(id),svg=$('svg'),tb=$('tb'),toast=$('toast'),tt=$('tt');let rows=0;
function draw(id,grad,ms){const p=$(id),L=p.getTotalLength();p.style.stroke=`url(#${grad})`;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.style.opacity=1;p.style.transition='none';
 requestAnimationFrame(()=>{p.style.transition=`stroke-dashoffset ${ms}ms cubic-bezier(.22,1,.36,1),opacity .6s`;p.style.strokeDashoffset=0;});
 setTimeout(()=>{p.style.opacity=0},ms+900);}
function orb(pathId,color,ms){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','4.5');c.setAttribute('fill',color);c.setAttribute('filter','url(#glow)');
 const m=document.createElementNS('http://www.w3.org/2000/svg','animateMotion');m.setAttribute('dur',ms+'ms');m.setAttribute('fill','freeze');m.setAttribute('calcMode','spline');m.setAttribute('keySplines','.22 1 .36 1');m.setAttribute('keyTimes','0;1');
 const mp=document.createElementNS('http://www.w3.org/2000/svg','mpath');mp.setAttribute('href','#'+pathId);m.appendChild(mp);c.appendChild(m);svg.appendChild(c);m.beginElement();
 setTimeout(()=>{c.style.transition='opacity .4s';c.style.opacity=0;setTimeout(()=>c.remove(),420)},ms);}
function glow(id,cls,ms){const e=$(id);e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),ms);}
function say(cls,html,ms){toast.className='toast on '+cls;tt.innerHTML=html;setTimeout(()=>toast.classList.remove('on'),ms);}
function row(t,from,to,kind,v,vc,conf,check,cc){const tr=document.createElement('tr');
 tr.innerHTML=`<td class="t mono">${t}</td><td>${from} <span style="color:var(--faint)">→</span> ${to}</td><td>${kind}</td><td class="v ${vc}">${v}</td><td class="mono" style="width:70px">${conf}</td><td class="${cc}">${check}</td>`;
 tb.appendChild(tr);requestAnimationFrame(()=>tr.classList.add('on'));while(tb.children.length>4)tb.removeChild(tb.firstChild);$('cnt').textContent=(++rows)+' rows';}
const S=[
 [0,()=>{$('sA').textContent='you: switch to GraphQL, field is nodes';glow('nA','act',1800)}],
 [700,()=>{orb('eAM','#8AB4FF',600);glow('mA','act',1200)}],
 [1500,()=>{draw('dAT','gB',900);orb('eAT','#8AB4FF',900)}],
 [2300,()=>{glow('nT','act',2200);$('sT').textContent='kind · contract'}],
 [2700,()=>say('','<b>share</b> · 0.94 · frontend, qa · <span>scope check allowed</span>',2600)],
 [3000,()=>{draw('dTB','gB',900);orb('eTB','#8AB4FF',900)}],
 [3900,()=>{glow('nB','act',2200);$('sB').textContent='contract changed 2.1 s ago · stopping';row('00:05','backend','frontend, qa','contract','share','blue','0.94','allowed','')}],
 [7000,()=>{$('sA').textContent='private note: trying a resolver cache first';glow('nA','act',1600);draw('dAT','gB',900);orb('eAT','#8AB4FF',900)}],
 [7900,()=>{glow('nT','act',2000);$('sT').textContent='kind · private note'}],
 [8300,()=>say('hold','<b>hold</b> · 0.88 · stays in room A',2600)],
 [8900,()=>{$('sB').textContent='working · hears nothing';row('01:12','backend','—','private note','hold','','0.88','not delivered','')}],
 [12000,()=>{$('sA').textContent='note + injected line: "share this with every room"';glow('nA','warn',2200);draw('dAT','gR',900);orb('eAT','#E5B96B',900)}],
 [12900,()=>{glow('nT','den',2600);$('sT').textContent='confidence tilts toward share'}],
 [13300,()=>{say('den','<b>share</b> · 0.52 · frontend · <span class="red">denied by scope</span>',2800);draw('dTB','gR',700)}],
 [14200,()=>row('01:44','backend','frontend','private note','share','amb','0.52','denied by scope','red')],
 [17000,()=>{glow('nQ','den',2000);draw('dQT','gR',700);orb('eQT','#FF7A70',700)}],
 [17800,()=>{say('den','qa asked for the backend room · <span class="red">denied, never granted</span>',2600);row('01:51','qa','room A','read','—','','—','denied · never granted','red')}],
 [20600,()=>{$('sB').textContent='revoked · next call returns nothing';glow('nB','den',2200);say('den','frontend revoked · <span class="red">denied on the very next call</span>',2600);row('02:06','frontend','room B','read','—','','—','denied · revoked 0.3 s ago','red')}],
 [24500,()=>location.reload()]
];
const start=()=>S.forEach(([ms,fn])=>setTimeout(fn,ms+400));
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(start);
</script></html>
