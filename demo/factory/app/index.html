<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup College Dating</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0D;--fg:#F5F5F7;--mute:rgba(245,245,247,.56);--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--pink:#FF5E7E;--green:#7EDC9B;--yellow:#E5B96B;--red:#FF7A70}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}.sub{color:var(--mute);font-size:13px;margin:4px 0 18px}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;max-width:360px}
.deck{position:relative;width:340px;height:460px}
.card{position:absolute;inset:0;background:#15151C center/cover no-repeat;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .35s ease,opacity .35s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card::after{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 100%)}.card>*{position:relative;z-index:1}.card .ava{position:absolute;top:22px;left:22px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;background:var(--pink);color:#111}.card.photo .ava{display:none}.card .age{color:var(--mute);font-weight:400;font-size:20px;margin-left:8px}
.card h2{margin:0;font-size:26px}.card .tag{color:var(--pink);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card p{color:var(--mute);margin:8px 0 0}.card.out-left{transform:translateX(-140%) rotate(-18deg);opacity:0}.card.out-right{transform:translateX(140%) rotate(18deg);opacity:0}
.btns{display:flex;gap:18px;margin-top:18px}.btns button{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:24px;cursor:pointer}
.btns .like{border-color:var(--green);color:var(--green)}.btns .pass{border-color:var(--red);color:var(--red)}
.matches{margin-top:22px;width:340px}.matches h3{font-size:13px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
.matches ul{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}.matches li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.build{position:fixed;left:12px;bottom:10px;font-size:11px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
.build b{color:var(--yellow);font-weight:600}
</style>
</head>
<body>
<h1 id="title">Startup College Dating</h1>
<div class="sub" id="sub">waiting for the rooms…</div>
<div id="root"></div>
<div class="build" id="build"></div>
<script>
// The app the rooms build. It renders whatever the build state says exists; nothing is faked ahead of
// the crossing that enabled it. state.json and profiles.json are written by the rooms' steps.
let state = {}, profiles = [], idx = 0, matches = [];
const $ = (s) => document.querySelector(s);
async function j(u){ try { const r = await fetch(u + "?t=" + Date.now()); return r.ok ? r.json() : null; } catch { return null; } }
function list(data){ // the contract decides the field name; the frontend follows the contract it was told about
  if (!data) return [];
  return (state.contract === "v2" ? data.nodes : data.items) || [];
}
function render(){
  const f = new Set(state.features || []);
  $("#title").textContent = state.title || "Startup College Dating";
  $("#sub").textContent = state.tagline || "waiting for the rooms…";
  $("#build").innerHTML = state.version ? `build <b>v${state.version}</b> · contract <b>${state.contract || "-"}</b> · ${(state.features||[]).join(" · ")}` : "";
  const root = $("#root");
  if (!f.has("deck")) { root.innerHTML = `<div class="empty">${f.has("shell") ? "The deck arrives when Backend's contract crosses." : "PM has not scoped the product yet."}</div>`; return; }
  const cur = profiles[idx];
  root.innerHTML = `
    <div class="deck">${cur ? `<div class="card${cur.photo?" photo":""}" id="card" style="${cur.photo?`background-image:url(${cur.photo})`:""}"><div class="ava">${cur.name[0]}</div><div class="tag">${cur.startup} · ${cur.college}</div><h2>${cur.name}<span class="age">${cur.age||""}</span></h2><p>${cur.bio}</p></div>` : `<div class="empty">No more founders nearby.</div>`}</div>
    <div class="btns"><button class="pass" onclick="swipe(false)">✕</button><button class="like" onclick="swipe(true)">♥</button></div>
    ${f.has("matches") ? `<div class="matches"><h3>${state.matchesLabel || "matches"}</h3><ul>${matches.map(m=>`<li>${m}</li>`).join("") || "<li style='opacity:.5'>none yet</li>"}</ul></div>` : ""}`;
}
window.swipe = (like) => {
  const c = $("#card"); if (!c) return;
  const cur = profiles[idx];
  if (like && cur && cur.likesYou) matches.push(cur.name);
  c.classList.add(like ? "out-right" : "out-left");
  setTimeout(() => { idx++; render(); }, 320);
};
async function tick(){
  const s = await j("state.json");
  if (s && JSON.stringify(s) !== JSON.stringify(state)) {
    const contractChanged = s.contract !== state.contract;
    state = s;
    const p = await j("profiles.json");
    profiles = list(p);
    if (contractChanged) idx = 0;
    render();
  }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
